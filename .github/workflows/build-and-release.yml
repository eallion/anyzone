name: Build and Release AnyZone

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag 版本号 (例如 v1.0.1)'
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOTOOLCHAIN: auto

jobs:
  prep:
    name: Prepare Version Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver_clean: ${{ steps.version.outputs.semver_clean }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
            IS_RELEASE="true"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            TAG="${GITHUB_REF_NAME}"
            IS_RELEASE="true"
          else
            TAG="nightly"
            IS_RELEASE="false"
          fi

          if [ "${TAG}" = "nightly" ]; then
            VER="0.0.0-nightly.${{ github.run_number }}"
            SEMVER_CLEAN="0.0.0.${{ github.run_number }}"
          else
            CLEAN="${TAG#v}"
            VER="${CLEAN}"
            BASE=$(echo "${CLEAN}" | cut -d'-' -f1)
            IFS='.' read -r -a P <<< "${BASE}"
            MAJOR=${P[0]:-0}
            MINOR=${P[1]:-0}
            PATCH=${P[2]:-0}
            SEMVER_CLEAN="${MAJOR}.${MINOR}.${PATCH}.0"
          fi

          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "semver_clean=${SEMVER_CLEAN}" >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT
          echo "准备构建版本: Tag=${TAG}, Version=${VER}, SemverClean=${SEMVER_CLEAN}, IsRelease=${IS_RELEASE}"

  build-linux:
    name: Build Linux Packages (${{ matrix.arch }})
    needs: prep
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            appimage_arch: x86_64
            appimagetool_url: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          - arch: arm64
            runner: ubuntu-24.04-arm
            appimage_arch: aarch64
            appimagetool_url: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential wget file

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install nfpm (Packaging tool)
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build Application Binary
        run: |
          go mod tidy
          VERSION="${{ needs.prep.outputs.version }}"
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('wails.json', 'utf8'));
            c.info.productVersion = '${{ needs.prep.outputs.semver_clean }}';
            fs.writeFileSync('wails.json', JSON.stringify(c, null, 2));
          "
          wails build -platform linux/${{ matrix.arch }} -tags webkit2_41 -ldflags "-X main.AppVersion=${VERSION}" -o anyzone

      - name: Package Linux Distributions
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          export VERSION ARCH

          # 1. 打包 .deb 与 .rpm
          nfpm pkg --packager deb --target anyzone_${VERSION}_linux_${ARCH}.deb
          nfpm pkg --packager rpm --target anyzone_${VERSION}_linux_${ARCH}.rpm

          # 2. 打包 .tar.gz
          tar -czvf anyzone_${VERSION}_linux_${ARCH}.tar.gz -C build/bin anyzone

          # 3. 打包 AppImage
          mkdir -p anyzone.AppDir/usr/bin
          mkdir -p anyzone.AppDir/usr/share/applications
          mkdir -p anyzone.AppDir/usr/share/icons/hicolor/256x256/apps

          cp build/bin/anyzone anyzone.AppDir/usr/bin/anyzone
          chmod +x anyzone.AppDir/usr/bin/anyzone

          cp build/linux/anyzone.desktop anyzone.AppDir/anyzone.desktop
          cp build/linux/anyzone.desktop anyzone.AppDir/usr/share/applications/anyzone.desktop
          cp build/appicon.png anyzone.AppDir/anyzone.png
          cp build/appicon.png anyzone.AppDir/usr/share/icons/hicolor/256x256/apps/anyzone.png

          cp build/linux/AppRun anyzone.AppDir/AppRun
          chmod +x anyzone.AppDir/AppRun

          # 下载对应架构的 appimagetool 并解包运行
          wget -q ${{ matrix.appimagetool_url }} -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract

          ARCH=${{ matrix.appimage_arch }} ./squashfs-root/AppRun anyzone.AppDir anyzone_${VERSION}_linux_${ARCH}.AppImage
          chmod +x anyzone_${VERSION}_linux_${ARCH}.AppImage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-dist-${{ matrix.arch }}
          path: |
            *.AppImage
            *.deb
            *.rpm
            *.tar.gz

  build-windows:
    name: Build Windows Packages (${{ matrix.arch }})
    needs: prep
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install NSIS
        if: matrix.arch == 'amd64'
        run: choco install nsis -y

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Windows Installer & Executable
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          go mod tidy
          VERSION="${{ needs.prep.outputs.version }}"
          ARCH=${{ matrix.arch }}
          BUILD_FLAGS=""
          if [ "${ARCH}" = "amd64" ]; then
            BUILD_FLAGS="-nsis"
          fi
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('wails.json', 'utf8'));
            c.info.productVersion = '${{ needs.prep.outputs.semver_clean }}';
            fs.writeFileSync('wails.json', JSON.stringify(c, null, 2));
          "
          wails build -platform windows/${ARCH} ${BUILD_FLAGS} -ldflags "-X main.AppVersion=${VERSION}" -o anyzone.exe

          # 1. 直接输出独立可执行文件 .exe 到根目录供下载
          cp build/bin/anyzone.exe anyzone_${VERSION}_windows_${ARCH}.exe

          # 2. 打包便携版 zip
          powershell Compress-Archive -Path build/bin/anyzone.exe -DestinationPath anyzone_${VERSION}_windows_${ARCH}_portable.zip

          # 3. 复制 NSIS 安装程序 (若已生成)
          find build/bin -type f -name "*installer.exe" -exec cp {} anyzone_${VERSION}_windows_${ARCH}_installer.exe \; || true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-dist-${{ matrix.arch }}
          path: |
            *.exe
            *.zip

  build-macos:
    name: Build macOS Packages (.dmg)
    needs: prep
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Wails CLI & create-dmg
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          brew install create-dmg

      - name: Build and Package macOS Apps
        run: |
          go mod tidy
          VERSION="${{ needs.prep.outputs.version }}"

          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('wails.json', 'utf8'));
            c.info.productVersion = '${{ needs.prep.outputs.semver_clean }}';
            fs.writeFileSync('wails.json', JSON.stringify(c, null, 2));
          "

          # 1. 编译并打包 Apple Silicon (ARM64) 原生版本
          wails build -platform darwin/arm64 -ldflags "-X main.AppVersion=${VERSION}" -o anyzone
          create-dmg \
            --volname "AnyZone" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 175 \
            "anyzone_${VERSION}_darwin_arm64.dmg" \
            "build/bin/anyzone.app" || true

          # 清理临时 app 产物以供通用构建
          rm -rf build/bin/anyzone.app

          # 2. 编译并打包 Universal (通用二进制，包含 ARM64 和 Intel x86_64)
          wails build -platform darwin/universal -ldflags "-X main.AppVersion=${VERSION}" -o anyzone
          create-dmg \
            --volname "AnyZone" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 175 \
            "anyzone_${VERSION}_darwin_universal.dmg" \
            "build/bin/anyzone.app" || cp -r build/bin/anyzone.app .

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-dist
          path: |
            *.dmg

  release:
    name: Publish GitHub Release
    needs: [prep, build-linux, build-windows, build-macos]
    if: needs.prep.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prep.outputs.tag_name }}"
          echo "准备发布 Release: ${TAG} ..."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，正在覆盖更新所有产物并标记为 Latest..."
            gh release upload "${TAG}" artifacts/* --clobber
            gh release edit "${TAG}" --title "AnyZone ${TAG}" --latest
          else
            echo "正在创建全新 Release ${TAG} 并上传产物..."
            gh release create "${TAG}" artifacts/* --title "AnyZone ${TAG}" --generate-notes --latest
          fi
