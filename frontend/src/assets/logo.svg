<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 主渐变：极光青到幻影紫 -->
    <linearGradient id="az-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- 背景暗光流转渐变 -->
    <linearGradient id="az-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- 边框描边渐变 -->
    <linearGradient id="az-grad-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85" />
    </linearGradient>

    <!-- 发光柔和阴影 -->
    <filter id="az-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 柔和外阴影 -->
    <filter id="az-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 外层标准圆角矩形底衬容器 (符合现代桌面规范，圆角 r=80) -->
  <g filter="url(#az-shadow)">
    <rect x="40" y="40" width="432" height="432" rx="80" ry="80"
          fill="url(#az-grad-bg)"
          stroke="url(#az-grad-border)"
          stroke-width="5" />
  </g>

  <!-- DNS 区域核心对称网络 (Zone Rings) -->
  <g stroke="url(#az-grad-primary)" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.35">
    <circle cx="256" cy="256" r="130" fill="none" />
    <circle cx="256" cy="256" r="75" fill="none" />
    <line x1="126" y1="256" x2="386" y2="256" />
    <line x1="256" y1="126" x2="256" y2="386" />
  </g>

  <!-- 核心 AnyZone 符号：上下绝对对称的 Z + 双向钻石拓扑 -->
  <g filter="url(#az-glow)">
    <!-- Z 主体折线 (上下完全等宽等长镜像) -->
    <path d="M161 181
             L351 181
             C360 181 366 190 360 198
             L152 314
             C146 322 152 331 161 331
             L351 331"
          fill="none"
          stroke="url(#az-grad-primary)"
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- 中心能量横梁 -->
    <line x1="206" y1="256" x2="306" y2="256"
          stroke="#38bdf8"
          stroke-width="14"
          stroke-linecap="round" />

    <!-- 双向对称钻石菱形架构 (纯白几何支架) -->
    <path d="M256 181 L206 256
             M256 181 L306 256
             M256 331 L206 256
             M256 331 L306 256"
          fill="none"
          stroke="#ffffff"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95" />
  </g>

  <!-- 全对称 DNS 拓扑节点 (关于 (256, 256) 中心对称) -->
  <circle cx="161" cy="181" r="9" fill="#38bdf8" />
  <circle cx="351" cy="181" r="9" fill="#38bdf8" />
  <circle cx="161" cy="331" r="9" fill="#a855f7" />
  <circle cx="351" cy="331" r="9" fill="#a855f7" />
  <circle cx="256" cy="181" r="11" fill="#ffffff" filter="url(#az-glow)" />
  <circle cx="256" cy="331" r="11" fill="#ffffff" filter="url(#az-glow)" />
  <circle cx="256" cy="256" r="13" fill="#ffffff" stroke="url(#az-grad-primary)" stroke-width="4" filter="url(#az-glow)" />
</svg>
