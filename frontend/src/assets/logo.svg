<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 主渐变：极光青到幻影紫 -->
    <linearGradient id="az-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- 背景暗光流转渐变 -->
    <linearGradient id="az-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- 发光柔和阴影 -->
    <filter id="az-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 柔和内嵌阴影 -->
    <filter id="az-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 外层六边科技盾形容器 -->
  <g filter="url(#az-shadow)">
    <path d="M256 36
             C272 36 392 102 436 128
             C448 136 456 148 456 164
             L456 348
             C456 364 448 376 436 384
             C392 410 272 476 256 476
             C240 476 120 410 76 384
             C64 376 56 364 56 348
             L56 164
             C56 148 64 136 76 128
             C120 102 240 36 256 36 Z"
          fill="url(#az-grad-bg)"
          stroke="url(#az-grad-primary)"
          stroke-width="8"
          stroke-linejoin="round" />
  </g>

  <!-- DNS 节点光轨网络 (Zone 概念) -->
  <g stroke="url(#az-grad-primary)" stroke-width="3" stroke-dasharray="6,6" opacity="0.35">
    <circle cx="256" cy="256" r="140" fill="none" />
    <circle cx="256" cy="256" r="85" fill="none" />
    <line x1="116" y1="256" x2="396" y2="256" />
    <line x1="256" y1="116" x2="256" y2="396" />
  </g>

  <!-- 核心 AnyZone 符号：A 与 Z 融合构型 -->
  <!-- A 顶峰与跨线，Z 的折线动态交织 -->
  <g filter="url(#az-glow)">
    <!-- Z 主体折线 -->
    <path d="M168 184
             L344 184
             C354 184 360 194 354 202
             L170 326
             C162 334 168 344 178 344
             L344 344"
          fill="none"
          stroke="url(#az-grad-primary)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- A 的两翼与顶峰支撑 -->
    <path d="M256 128
             L184 268
             M256 128
             L328 268"
          fill="none"
          stroke="#ffffff"
          stroke-width="18"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.9" />

    <!-- A 的中央水平能量连杆 -->
    <path d="M206 236 L306 236"
          fill="none"
          stroke="#38bdf8"
          stroke-width="14"
          stroke-linecap="round" />
  </g>

  <!-- DNS 核心枢纽节点 -->
  <circle cx="256" cy="128" r="10" fill="#ffffff" filter="url(#az-glow)" />
  <circle cx="168" cy="184" r="8" fill="#38bdf8" />
  <circle cx="344" cy="184" r="8" fill="#a855f7" />
  <circle cx="178" cy="344" r="8" fill="#38bdf8" />
  <circle cx="344" cy="344" r="8" fill="#a855f7" />
  <circle cx="256" cy="256" r="12" fill="#ffffff" stroke="url(#az-grad-primary)" stroke-width="4" filter="url(#az-glow)" />
</svg>
